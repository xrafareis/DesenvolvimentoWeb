<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Celulares e Acessórios</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Cadastro de Celulares e Acessórios</h1>
    <form action="processa.php" method="POST">
        <label>Marca do Celular:</label>
        <input type="text" name="marca" required><br>
        <label>Modelo:</label>
        <input type="text" name="modelo" required><br>
        <label>Tipo de Acessório:</label>
        <input type="text" name="acessorio" required><br>
        <label>Cor:</label>
        <input type="text" name="cor"><br>
        <label>Armazenamento (GB):</label>
        <input type="number" name="armazenamento"><br>
        <label>Memória RAM (GB):</label>
        <input type="number" name="ram"><br>
        <label>Sistema Operacional:</label>
        <input type="text" name="sistema"><br>
        <label>Conectividade:</label>
        <input type="text" name="conectividade"><br>
        <label>Preço (R$):</label>
        <input type="number" step="0.01" name="preco"><br>
        <label>Data de Lançamento:</label>
        <input type="date" name="lancamento"><br>
        <label>Fabricante:</label>
        <input type="text" name="fabricante"><br>
        <label>Tipo de Tela:</label>
        <input type="text" name="tela"><br>
        <label>Resolução da Câmera (MP):</label>
        <input type="number" name="camera"><br>
        <label>Tipo de Carregador:</label>
        <input type="text" name="carregador"><br>
        <label>Observações:</label>
        <textarea name="observacoes"></textarea><br>
        <input type="submit" value="Cadastrar">
    </form>
</body>
</html>
