<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina do Rafael</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #dfedff;
            color: #1f2937;
            margin: 0;
            padding: 32px;
            }
            .box {
                max-width: 900px;
                margin: 0 auto;
                background: #b7d4fa;
                border-radius: 12px;
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
                padding: 28px;
            }
            h1,h2,h3,h4,h5,h6 {
                color: #0f172a;
                margin-top: 16px;
                margin-bottom: 12px;
            }
        p {
            line-height: 1.6;
        }
        hr {
            border: 0;
            border-top: 3px solid #181b1f;
            margin: 24px 0;
        }
    </style>
</head>
<body>
    <div class="box">
       <h1>Irei editar essa página em breve</h1>
       <br><br>
       <h2>Obrigado</h2>
    </div>
</body>

</html>
