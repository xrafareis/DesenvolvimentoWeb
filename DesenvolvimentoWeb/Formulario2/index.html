<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Celulares e Acessórios</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Cadastro de Celulares e Acessórios</h1>
    <form action="processa.php" method="post">
        <label>Marca do Celular:</label>
        <input type="text" name="marca" required><br>
        <label>Modelo:</label>
        <input type="text" name="modelo" required><br>
        <label>Tipos de Acessórios:</label>
        <input type="text" name="acessorio" required><br>
        <label>Cor:</label>
        <input type="text" name="cor">
        <label>Armazenamento (GB):</label>
        <input type="number" name="armazenamento"><br>
        <label>Memória RAM (GB):</label>
        <input type="number" name="ram"><br>
        <label>Sistema Operacional:</label>
        <input type="text" name="sistema"><br>
        <input type="submit" value="Cadastrar">
    </form>
</body>
</html>
